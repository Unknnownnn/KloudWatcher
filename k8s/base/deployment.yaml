apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudwatcher-frontend
  namespace: kloudwatcher
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kloudwatcher
      tier: frontend
  template:
    metadata:
      labels:
        app: kloudwatcher
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: kloudwatcher/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: supabase-url
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: supabase-anon-key
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudwatcher-prediction-service
  namespace: kloudwatcher
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kloudwatcher
      tier: prediction
  template:
    metadata:
      labels:
        app: kloudwatcher
        tier: prediction
    spec:
      containers:
      - name: prediction-service
        image: kloudwatcher/prediction-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: supabase-url
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: supabase-service-key
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15 