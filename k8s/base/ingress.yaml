apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kloudwatcher-ingress
  namespace: kloudwatcher
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - kloudwatcher.com
    - api.kloudwatcher.com
    secretName: kloudwatcher-tls
  rules:
  - host: kloudwatcher.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kloudwatcher-frontend
            port:
              number: 80
  - host: api.kloudwatcher.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kloudwatcher-prediction-service
            port:
              number: 8000 